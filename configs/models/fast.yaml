# =============================================================================
# Fast variant for CI, smoke tests and local iteration.
#
#   python -m application.train_pipeline models@model=fast
#
# Small forests, no tuning, single calibration method. Metrics from this profile
# are not comparable with the default profile and must never be promoted.
# =============================================================================

catboost:
  enabled: true
  params:
    iterations: 60
    depth: 4
    learning_rate: 0.15
    l2_leaf_reg: 3.0
    loss_function: Logloss
    allow_writing_files: false
    verbose: false
  search_space: {}

xgboost:
  enabled: true
  params:
    n_estimators: 60
    max_depth: 4
    learning_rate: 0.15
    subsample: 0.9
    colsample_bytree: 0.9
    tree_method: hist
    eval_metric: aucpr
  search_space: {}

lightgbm:
  enabled: true
  params:
    n_estimators: 60
    num_leaves: 15
    learning_rate: 0.15
    min_child_samples: 10
    objective: binary
    verbosity: -1
  search_space: {}

random_forest:
  enabled: true
  params:
    n_estimators: 60
    max_depth: 8
    min_samples_leaf: 2
    max_features: sqrt
  search_space: {}

ensemble:
  enabled: true
  meta_learner: logistic_regression
  cv_folds: 3
  passthrough: false
  calibrate: true

calibration:
  enabled: true
  methods: [sigmoid]
  cv_folds: 3
  n_bins: 10
  max_calibration_error: 0.10

tuning:
  enabled: false
  n_trials: 3
  timeout_s: 0
  directions: [maximize, minimize]
  pr_auc_weight: 0.85
  latency_weight: 0.15
  latency_budget_ms: 10.0
  n_startup_trials: 2
  pruning_enabled: false
  seed: 42
  n_jobs: 1

cost:
  false_negative_cost: 10.0
  false_positive_cost: 1.0
  true_positive_cost: 0.0
  true_negative_cost: 0.0

pd_floor: 0.0003
pd_cap: 1.0
risk_band_thresholds: [0.01, 0.05, 0.15, 0.30]
selection_min_pr_auc: 0.0
selection_max_latency_ms: 1000.0
